name: CI

on:
  pull_request:
  push:
    branches: [main]

# Pull requests from forks run with a read-only token and no secrets.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Bridge and web tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test

  browser:
    name: Office page in a browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  desktop:
    name: Desktop app server tests (Rust)
    # macOS has the system libraries Tauri links against, so no extra setup is needed.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app embeds three.js from the root node_modules (include_str!).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: cargo test --locked

  sizes:
    name: No large files in git
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every clone downloads a file forever once it's committed. Videos and big images belong in a GitHub
      # comment's user-attachments link instead (see scripts/record-trailer.mjs). City data is the exception.
      - name: Added or changed files stay under 1 MB
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          big=$(git diff --diff-filter=AM --name-only "$BASE" HEAD -- . ':!web/cities/' | while IFS= read -r f; do
            size=$(git cat-file -s "HEAD:$f"); if [ "$size" -gt 1048576 ]; then echo "$f ($(( size / 1024 )) KB)"; fi
          done)
          if [ -n "$big" ]; then echo "::error::Files over 1 MB belong outside git:"; echo "$big"; exit 1; fi
