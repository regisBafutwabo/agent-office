name: CI

on:
  pull_request:
  push:
    branches: [main]

# Pull requests from forks run with a read-only token and no secrets.
permissions:
  contents: read

# A new push to a pull request replaces the run for the old one. Every push to main keeps its own run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Bridge and web tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: npm audit (desktop app tools)
        run: npm audit --audit-level=high
        working-directory: desktop
      - run: npm test

  browser:
    name: Office page in a browser (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      # Screenshots, traces and error context of the tests that failed, to download from the run's summary.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: test-results/
          retention-days: 14

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -fsSLo gitleaks.tgz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      # The whole history, so a secret can't slip in through an old commit of a pull request.
      - run: ./gitleaks git . --no-banner --redact --config .gitleaks.toml

  desktop:
    name: Desktop app server tests (Rust)
    # macOS has the system libraries Tauri links against, so no extra setup is needed.
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The app embeds three.js from the root node_modules (include_str!).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
      - run: cargo test --locked
      - uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit
      # Known vulnerabilities in the Rust crates the app ships. "Unmaintained" notices are only warnings.
      - run: cargo audit

  desktop-build:
    name: Desktop app builds (Tauri bundle)
    # cargo test compiles the code but never bundles the app. This checks the bundle config, icons and entitlements
    # before release day. Updater artifacts need the private signing key, so they are left out here.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci
        working-directory: desktop
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: desktop/src-tauri
          key: bundle
      - run: npx tauri build --ci --bundles app --config '{"bundle":{"createUpdaterArtifacts":false}}'
        working-directory: desktop
      - name: The app bundle exists
        run: test -x "desktop/src-tauri/target/release/bundle/macos/Agent Office.app/Contents/MacOS/agent-office"

  shell:
    name: Shell scripts (shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The hooks run inside every agent session, so a quoting mistake there breaks people's agents, not just the office.
      - run: shellcheck --version && shellcheck adapters/hook.sh plugin/hooks/*.sh scripts/*.sh

  sizes:
    name: No large files in git
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # Every clone downloads a file forever once it's committed. Videos and big images belong in a GitHub
      # comment's user-attachments link instead (see scripts/record-trailer.mjs). City data is the exception.
      - name: Added or changed files stay under 1 MB
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          big=$(git diff --diff-filter=AM --name-only "$BASE" HEAD -- . ':!web/cities/' | while IFS= read -r f; do
            size=$(git cat-file -s "HEAD:$f"); if [ "$size" -gt 1048576 ]; then echo "$f ($(( size / 1024 )) KB)"; fi
          done)
          if [ -n "$big" ]; then echo "::error::Files over 1 MB belong outside git:"; echo "$big"; exit 1; fi
